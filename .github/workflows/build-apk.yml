name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor & Generate Android Project
        run: |
          npm install --no-save @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK to Discy.apk
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Discy.apk

      - name: Upload Discy.apk as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Discy-APK
          path: Discy.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Discy Android APK (Build #${{ github.run_number }})"
          body: "Baixe o arquivo **Discy.apk** abaixo e instale no seu celular Android."
          files: Discy.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
